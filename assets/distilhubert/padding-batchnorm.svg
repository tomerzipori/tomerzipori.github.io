<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">How padded frames enter BatchNorm statistics</title>
  <desc id="desc">Three audio sequences have valid frames of different lengths and padded zero frames. Ordinary BatchNorm includes both valid and padded frames in its mean and variance, while masked BatchNorm includes only valid frames.</desc>
  <defs>
    <pattern id="padding" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ebe8df"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#c9914c" stroke-width="4" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="960" height="420" fill="#f7f5ef"/>
  <text x="46" y="50" fill="#6b6a65" font-family="ui-monospace, monospace" font-size="15" letter-spacing="1.2">ONE BATCH · THREE CLIPS</text>
  <text x="46" y="93" fill="#282826" font-family="Georgia, serif" font-size="30">The zeros keep the rectangle neat.</text>
  <text x="46" y="124" fill="#282826" font-family="Georgia, serif" font-size="30">They do not belong in the statistics.</text>

  <g transform="translate(46 166)">
    <text x="0" y="17" fill="#6b6a65" font-family="ui-monospace, monospace" font-size="13">CLIP A</text>
    <rect x="82" y="0" width="430" height="26" rx="4" fill="#3158c9"/>
    <rect x="512" y="0" width="250" height="26" fill="url(#padding)"/>

    <text x="0" y="75" fill="#6b6a65" font-family="ui-monospace, monospace" font-size="13">CLIP B</text>
    <rect x="82" y="58" width="294" height="26" rx="4" fill="#3158c9"/>
    <rect x="376" y="58" width="386" height="26" fill="url(#padding)"/>

    <text x="0" y="133" fill="#6b6a65" font-family="ui-monospace, monospace" font-size="13">CLIP C</text>
    <rect x="82" y="116" width="568" height="26" rx="4" fill="#3158c9"/>
    <rect x="650" y="116" width="112" height="26" fill="url(#padding)"/>

    <text x="82" y="174" fill="#3158c9" font-family="ui-monospace, monospace" font-size="13">VALID AUDIO FRAMES</text>
    <text x="576" y="174" fill="#a06d2f" font-family="ui-monospace, monospace" font-size="13">PADDED ZEROS</text>
  </g>

  <path d="M808 176 C850 176 850 213 883 213" fill="none" stroke="#282826" stroke-width="2"/>
  <path d="M808 282 C850 282 850 245 883 245" fill="none" stroke="#282826" stroke-width="2"/>
  <circle cx="889" cy="229" r="42" fill="#f7f5ef" stroke="#282826" stroke-width="2"/>
  <text x="889" y="222" text-anchor="middle" fill="#282826" font-family="Georgia, serif" font-size="19">mean</text>
  <text x="889" y="246" text-anchor="middle" fill="#282826" font-family="Georgia, serif" font-size="19">variance</text>

  <line x1="46" y1="383" x2="914" y2="383" stroke="#d4d1c8"/>
  <text x="46" y="408" fill="#6b6a65" font-family="ui-monospace, monospace" font-size="13">ORDINARY PATH: BLUE + STRIPED</text>
  <text x="526" y="408" fill="#3158c9" font-family="ui-monospace, monospace" font-size="13">MASKED PATH: BLUE ONLY</text>
</svg>
