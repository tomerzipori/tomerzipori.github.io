<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Where activations were recorded</title>
  <desc id="desc">A sentence enters a transformer layer. At the target word position, the representation passes through attention and an MLP. The study records the 6912 gated MLP activations before the down projection.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#3158c9"/></marker>
    <style>.label{font:500 16px 'IBM Plex Mono',monospace;fill:#282826}.small{font:14px system-ui,sans-serif;fill:#6b6a65}.word{font:500 19px system-ui,sans-serif;fill:#282826}.box{fill:#f7f5ef;stroke:#282826;stroke-width:2}.soft{fill:#ebe8df;stroke:#d4d1c8;stroke-width:1.5}.active{fill:#dbe2f7;stroke:#3158c9;stroke-width:2}.line{fill:none;stroke:#3158c9;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="430" rx="18" fill="#f7f5ef"/>
  <text x="54" y="51" class="label">INPUT SENTENCE</text>
  <g transform="translate(54 74)">
    <rect class="soft" width="112" height="54" rx="8"/><text class="word" x="56" y="34" text-anchor="middle">They</text>
    <rect class="soft" x="122" width="146" height="54" rx="8"/><text class="word" x="195" y="34" text-anchor="middle">mentioned</text>
    <rect class="soft" x="278" width="88" height="54" rx="8"/><text class="word" x="322" y="34" text-anchor="middle">the</text>
    <rect class="soft" x="376" width="100" height="54" rx="8"/><text class="word" x="426" y="34" text-anchor="middle">word</text>
    <rect class="active" x="486" width="126" height="54" rx="8"/><text class="word" x="549" y="34" text-anchor="middle">otter</text>
  </g>
  <path class="line" d="M603 128v49h101"/>
  <text x="603" y="158" class="small" text-anchor="end">follow this position</text>
  <g transform="translate(54 216)">
    <rect class="box" width="186" height="108" rx="10"/><text class="label" x="93" y="47" text-anchor="middle">ATTENTION</text><text class="small" x="93" y="73" text-anchor="middle">mix context</text>
    <path class="line" d="M196 54h52"/>
    <rect class="active" x="258" width="282" height="108" rx="10"/><text class="label" x="399" y="39" text-anchor="middle">MLP</text><text class="small" x="399" y="65" text-anchor="middle">expand → gate → compress</text><text class="small" x="399" y="88" text-anchor="middle">6,912 gated activations</text>
    <path class="line" d="M550 54h52"/>
    <rect class="box" x="612" width="240" height="108" rx="10"/><text class="label" x="732" y="47" text-anchor="middle">NEXT LAYER</text><text class="small" x="732" y="73" text-anchor="middle">repeat 26 times</text>
  </g>
  <path d="M453 324v42" fill="none" stroke="#c9914c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="453" y="398" class="label" text-anchor="middle">RECORD HERE, BEFORE DOWN PROJECTION</text>
</svg>
