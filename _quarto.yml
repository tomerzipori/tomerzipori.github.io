project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/build_content.py
  render:
    - "*.qmd"
    - "about/**/*.qmd"
    - "blog/**/*.qmd"
    - "garden/**/*.qmd"
    - "experiments/**/*.qmd"
    - "notes/**/*.qmd"
    - "posts/**/*.qmd"
    - "questions/**/*.qmd"
    - "writing/**/*.qmd"
  resources:
    - "_generated/**"
    - "assets/neuron-playground/**"
    - "assets/functional-localizer/**"

website:
  title: "Tomer Zipori"
  site-url: https://tomerzipori.github.io/
  description: "Selected work on models, evidence, and useful research tools."
  favicon: assets/favicon.svg
  search: false
  navbar: false

format:
  html:
    theme: none
    css: /styles.css
    title-block-style: none
    toc: false
    html-math-method: katex
    code-fold: false
    smooth-scroll: true

execute:
  freeze: true
